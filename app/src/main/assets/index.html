<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raja Predictor Pro - AI Advanced</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            border: 1px solid #334155;
        }
        .header {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 15px;
        }
        .timer-box {
            text-align: center;
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #475569;
        }
        .timer {
            font-size: 30px;
            font-weight: bold;
            color: #f59e0b;
        }
        .period-text {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 15px;
            text-align: center;
            background: #0f172a;
            padding: 6px;
            border-radius: 6px;
        }
        .prediction-card {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }
        .prediction-title {
            font-size: 13px;
            color: #bfdbfe;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .prediction-result {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
        }
        .confidence {
            font-size: 12px;
            color: #a7f3d0;
            margin-top: 5px;
        }
        .history-box {
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            max-height: 140px;
            overflow-y: auto;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #1e293b;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">👑 Raja Predictor AI Pro 👑</div>

        <!-- Live Period Info -->
        <div class="period-text" id="periodText">Loading Live Period...</div>

        <!-- Timer Section -->
        <div class="timer-box">
            <div>Next Result In</div>
            <div class="timer" id="timer">00:30</div>
        </div>

        <!-- Smart Prediction Display -->
        <div class="prediction-card">
            <div class="prediction-title">Memory Trend Analysis</div>
            <div class="prediction-result" id="predictionDisplay">Calculating...</div>
            <div class="confidence" id="confidenceDisplay">Accuracy Model: Syncing...</div>
        </div>

        <!-- Recent History / Memory Log -->
        <div style="font-size: 13px; margin-bottom: 5px; font-weight: bold; color: #cbd5e1;">Algorithm Memory Log:</div>
        <div class="history-box" id="historyBox">
            <!-- Dynamic History -->
        </div>
    </div>

    <script>
        let timeLeft = 30;
        let pastResults = [];

        function getLivePeriodNumber() {
            let now = new Date();
            let year = now.getFullYear();
            let month = String(now.getMonth() + 1).padStart(2, '0');
            let day = String(now.getDate()).padStart(2, '0');
            
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            let totalSecondsToday = (hours * 3600) + (minutes * 60) + seconds;
            let blockNumber = Math.floor(totalSecondsToday / 30) + 1000;

            return `${year}${month}${day}${blockNumber}`;
        }

        function startEngine() {
            updatePeriod();
            runPredictionAlgorithm();

            let timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    saveToMemoryAndRefresh();
                    timeLeft = 30;
                    startEngine();
                } else {
                    let seconds = timeLeft < 10 ? '0' + timeLeft : timeLeft;
                    document.getElementById('timer').innerText = `00:${seconds}`;
                    timeLeft--;
                }
            }, 1000);
        }

        function updatePeriod() {
            let currentPeriod = getLivePeriodNumber();
            document.getElementById('periodText').innerText = `Live Period ID: ${currentPeriod}`;
        }

        function runPredictionAlgorithm() {
            const colors = ['Green', 'Red', 'Violet'];
            const sizes = ['Big', 'Small'];

            let predictedColor, predictedSize, predictedNum;
            let confidence = Math.floor(Math.random() * 15) + 85;

            if (pastResults.length >= 3) {
                let lastColor = pastResults[0].color;
                if (lastColor === 'Red') {
                    predictedColor = Math.random() > 0.4 ? 'Green' : 'Red';
                } else {
                    predictedColor = Math.random() > 0.5 ? 'Red' : 'Green';
                }
            } else {
                predictedColor = 'Green';
            }

            predictedSize = predictedColor === 'Green' ? 'Big' : 'Small';
            predictedNum = Math.floor(Math.random() * 10);
            if(predictedNum === 0 || predictedNum === 5) predictedColor = 'Violet';

            document.getElementById('predictionDisplay').innerHTML = `${predictedColor} / ${predictedSize} (${predictedNum})`;
            document.getElementById('confidenceDisplay').innerHTML = `AI Confidence: ${confidence}% | Pattern Match: Stable`;
        }

        function saveToMemoryAndRefresh() {
            let currentPeriod = getLivePeriodNumber();
            const colors = ['Green', 'Red', 'Green', 'Red', 'Violet'];
            let actualColor = colors[Math.floor(Math.random() * colors.length)];
            let actualNum = Math.floor(Math.random() * 10);
            let actualSize = actualNum >= 5 ? 'Big' : 'Small';

            pastResults.unshift({ period: currentPeriod, color: actualColor, num: actualNum, size: actualSize });
            if (pastResults.length > 10) pastResults.pop();

            let historyBox = document.getElementById('historyBox');
            historyBox.innerHTML = '';

            pastResults.forEach(item => {
                let div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `<span>#${item.period.slice(-6)}</span> <span style="color: ${item.color === 'Green' ? '#4ade80' : (item.color === 'Red' ? '#f87171' : '#c084fc')}; font-weight:bold;">${item.color} (${item.num}) - ${item.size}</span>`;
                historyBox.appendChild(div);
            });
        }

        startEngine();
    </script>
</body>
</html>
