<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raja Predictor Pro - Live Sync</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            border: 1px solid #334155;
        }
        .header {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 15px;
        }
        .timer-box {
            text-align: center;
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #475569;
        }
        .timer {
            font-size: 30px;
            font-weight: bold;
            color: #f59e0b;
        }
        .period-text {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 15px;
            text-align: center;
            background: #0f172a;
            padding: 6px;
            border-radius: 6px;
        }
        .prediction-card {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }
        .prediction-title {
            font-size: 13px;
            color: #bfdbfe;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .prediction-result {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
        }
        .confidence {
            font-size: 12px;
            color: #a7f3d0;
            margin-top: 5px;
        }
        .history-box {
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            max-height: 150px;
            overflow-y: auto;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #1e293b;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">👑 Raja Predictor AI Pro 👑</div>

        <!-- Exact Matched Live Period -->
        <div class="period-text" id="periodText">Syncing Period...</div>

        <!-- Timer Section -->
        <div class="timer-box">
            <div>Next Result In</div>
            <div class="timer" id="timer">00:30</div>
        </div>

        <!-- Smart Prediction Display -->
        <div class="prediction-card">
            <div class="prediction-title">AI Pattern Prediction</div>
            <div class="prediction-result" id="predictionDisplay">Analyzing...</div>
            <div class="confidence" id="confidenceDisplay">Accuracy: 94% | Mode: Live Match</div>
        </div>

        <!-- History Log -->
        <div style="font-size: 13px; margin-bottom: 5px; font-weight: bold; color: #cbd5e1;">Live History Log:</div>
        <div class="history-box" id="historyBox"></div>
    </div>

    <script>
        let pastResults = [];
        let lastProcessedBlock = "";

        function getExactGamePeriod() {
            let now = new Date();
            let year = now.getFullYear();
            let month = String(now.getMonth() + 1).padStart(2, '0');
            let day = String(now.getDate()).padStart(2, '0');
            
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            
            // Din ke total 30-second ke blocks nikal kar asli game ki tarah sequence banate hain
            let totalBlocksToday = (hours * 120) + (minutes * 2) + Math.floor(seconds / 30);
            let sequenceNumber = String(totalBlocksToday + 1).padStart(5, '0'); // jaise 00273

            return `${year}${month}${day}${sequenceNumber}`;
        }

        function engineSync() {
            let now = new Date();
            let seconds = now.getSeconds();
            let secondsLeft = 30 - (seconds % 30);
            
            let currentPeriod = getExactGamePeriod();

            // Timer display update
            let displaySec = secondsLeft < 10 ? '0' + secondsLeft : secondsLeft;
            document.getElementById('timer').innerText = `00:${displaySec}`;
            document.getElementById('periodText').innerText = `Live Period ID: ${currentPeriod}`;

            // Jab naya period shuru ho
            if (lastProcessedBlock !== currentPeriod) {
                if (lastProcessedBlock !== "") {
                    pushToHistory(lastProcessedBlock);
                }
                lastProcessedBlock = currentPeriod;
                runAIAlgorithm();
            }
        }

        function runAIAlgorithm() {
            const colors = ['Green', 'Red'];
            let predictedColor = colors[Math.floor(Math.random() * colors.length)];
            let predictedSize = predictedColor === 'Green' ? 'Big' : 'Small';
            let predictedNum = predictedColor === 'Green' ? Math.floor(Math.random() * 5) + 5 : Math.floor(Math.random() * 5);
            
            // Rare chance for Violet (0 or 5)
            if(predictedNum === 0 || predictedNum === 5) {
                predictedColor = 'Violet';
            }

            let confidence = Math.floor(Math.random() * 6) + 93; // 93% - 98%

            document.getElementById('predictionDisplayinnerHTML') = '';
            document.getElementById('predictionDisplay').innerHTML = `${predictedColor} / ${predictedSize} (${predictedNum})`;
            document.getElementById('confidenceDisplay').innerHTML = `AI Confidence: ${confidence}% | Status: Stable`;
        }

        function pushToHistory(periodCode) {
            const colors = ['Green', 'Red', 'Violet'];
            let actualColor = colors[Math.floor(Math.random() * colors.length)];
            let actualNum = Math.floor(Math.random() * 10);
            let actualSize = actualNum >= 5 ? 'Big' : 'Small';

            pastResults.unshift({ period: periodCode, color: actualColor, num: actualNum, size: actualSize });
            if (pastResults.length > 10) pastResults.pop();

            let historyBox = document.getElementById('historyBox');
            historyBox.innerHTML = '';

            pastResults.forEach(item => {
                let colorCode = item.color === 'Green' ? '#4ade80' : (item.color === 'Red' ? '#f87171' : '#c084fc');
                let div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `<span>#${item.period}</span> <span style="color: ${colorCode}; font-weight:bold;">${item.color} (${item.num}) - ${item.size}</span>`;
                historyBox.appendChild(div);
            });
        }

        setInterval(engineSync, 1000);
        engineSync();
    </script>
</body>
</html>
